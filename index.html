    <!-- The opening, painted from this document's own bytes: no stylesheet, no script,
         no remote image. See #boot-shell in the body. -->
    <style>
      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 2rem 1.75rem 2.25rem;
        pointer-events: none;
        color: #faf8f5;
        background:
          radial-gradient(120% 80% at 50% 0%, #183152 0%, #0b1828 55%, #070c16 100%);
      }
      @media (min-width: 768px) {
        #boot-shell { padding: 3.5rem 4rem 3rem; }
      }
      .bs-top { display: flex; align-items: center; gap: 0.75rem; }
      .bs-mark { display: block; height: 32px; width: 32px; object-fit: contain; }
      @media (min-width: 768px) {
        .bs-mark { height: 40px; width: 40px; }
      }
      .bs-word, .bs-year, .bs-note {
        font-family: system-ui, -apple-system, "Montserrat", Arial, sans-serif;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.34em;
        text-transform: uppercase;
      }
      .bs-word { color: #c9a87c; }
      .bs-year { margin-left: auto; color: rgba(250, 248, 245, 0.4); }
      .bs-bar { height: 1px; background: rgba(250, 248, 245, 0.15); position: relative; overflow: hidden; }
      .bs-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        transform-origin: left center;
        background: linear-gradient(90deg, #b87333, #c9a87c);
        animation: bs-load 2.6s cubic-bezier(0.4, 0, 0.2, 1) both;
      }
      @keyframes bs-load {
        from { transform: scaleX(0); }
        to { transform: scaleX(0.9); }
      }
      .bs-note { margin-top: 0.85rem; color: rgba(201, 168, 124, 0.75); }

      /* The welcome itself. The headline is the largest thing on the first screen,
         so it is drawn here, from the document's own bytes, instead of waiting for
         the script to mount and animate it in — that wait was the whole of the
         Largest Contentful Paint. The card that takes over paints the same line, in
         the same place, at the same size and in the same face, so the handover is
         invisible; the mid block reserves the kicker's line above the rule so the
         headline does not move when the hour's kicker fades in under it. */
      .bs-mid { max-width: 42rem; }
      .bs-kicker { height: 11px; }
      .bs-rule {
        margin-top: 1rem;
        height: 1px;
        width: 9rem;
        background: linear-gradient(90deg, #b87333, #c9a87c 58%, transparent);
      }
      .bs-headline {
        margin-top: 1.25rem;
        font-family: "Playfair Display", Georgia, serif;
        font-size: 2.6rem;
        line-height: 1.02;
        color: #faf8f5;
      }
      @media (min-width: 768px) {
        .bs-rule { width: 16rem; }
        .bs-headline { font-size: 6rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        .bs-bar::after { animation: none; transform: scaleX(0.5); }
      }
    </style>
